version: 2

updates:
  # GitHub Actions are pinned by commit in the workflows; Dependabot rewrites
  # the commit and the version comment. A week's cooldown keeps a day-zero
  # release out of the pipeline.
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    cooldown:
      default-days: 7
    open-pull-requests-limit: 10
    labels:
      - "dependencies"
      - "github-actions"
    groups:
      actions-minor-patch:
        update-types:
          - "minor"
          - "patch"

  # Python dependencies are locked by PDM, which Dependabot does not update;
  # they are bumped with `pdm update` locally.
