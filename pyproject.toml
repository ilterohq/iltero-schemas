[project]
name = "iltero-schemas"
version = "0.1.0"
description = "Shared contract for Iltero: schemas, canonicalization, assertion compiler and the pinned OPA evaluator"
authors = [{name = "Iltero Team"}]
requires-python = ">=3.11"
readme = "README.md"
license = "Apache-2.0"
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Typing :: Typed",
]
dependencies = [
    "pydantic>=2.11.0",  # models that read external input (extra="forbid"); serialize_by_alias needs 2.11
    "pyyaml>=6.0",       # assertion documents (safe loader only)
    "rfc8785>=0.1.4",    # RFC 8785 JSON canonicalization
    "packaging>=23.0",   # PEP 440 version specifiers in evaluator bindings
]

[dependency-groups]
dev = [
    "pytest>=9.0.3",
    "mypy>=1.11.0",
    "ruff>=0.5.0",
    "types-PyYAML>=6.0.12",
    "cryptography>=43.0",  # tests only: a throwaway key signs the bundle OPA must verify
    "twine>=7.0.0",  # checks the built distributions before a release; 7 reads wheel metadata version 2.5
    # The build backend, same pin as [build-system]. The release builds with --no-isolation, so the backend and
    # everything it needs come from this hash-pinned lock rather than an unpinned install.
    "hatchling==1.32.4",
    "editables>=0.5",  # hatchling's editable install of this project, also installed with --no-isolation
]

[project.urls]
Repository = "https://github.com/ilterohq/iltero-schemas"

[tool.pdm.scripts]
lint = "ruff check src tests scripts"
format = "ruff format --check src tests scripts"
typecheck = "mypy src tests scripts"
test = "pytest tests"
gate = "bash scripts/check-public-surface.sh"
check = {composite = ["lint", "format", "typecheck", "test", "gate"]}

[build-system]
# One exact build backend, so the same commit builds the same files whenever it is rebuilt.
requires = ["hatchling==1.32.4"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/iltero_schemas"]

[tool.hatch.build.targets.sdist]
exclude = ["tests/", "scripts/", "docs/", ".github/", ".gitignore", ".gitattributes"]

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP", "S", "T20", "B"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101", "S603", "S607"]  # asserts and real spawns are the tests' job
"scripts/**" = ["T201", "S603"]  # maintenance scripts report on stdout and spawn the pinned evaluator

[tool.mypy]
python_version = "3.11"
strict = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
pythonpath = ["."]
