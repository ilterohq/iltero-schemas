apiVersion: iltero.io/v1
kind: TechnicalAssertion
metadata:
  id: ILT.AWS.RDS.NOT_PUBLIC
  version: "1.0.0"
  title: RDS instance not publicly accessible
spec:
  stage: plan
  target:
    kind: resource
    tool: terraform
    provider: aws
    resource_types: [aws_db_instance]
  assert:
    path: resource.after.publicly_accessible
    equal: false
