apiVersion: iltero.io/v1
kind: TechnicalAssertion
metadata:
  id: ILT.CHANGE.PRODUCTION_APPROVED
  version: "1.0.0"
  title: Production change approved by a security reviewer
spec:
  stage: pre_deploy
  target:
    kind: change
  when:
    path: context.environment.name
    equal: production
  assert:
    exists:
      in: approvals
      where:
        all:
          - path: item.status
            equal: approved
          - path: item.roles
            contains: security
          - path: item.subject.digest
            equal:
              path: change.digest
