apiVersion: iltero.io/v1
kind: TechnicalAssertion
metadata:
  id: ILT.CHANGE.SENSITIVE_CHANGE_APPROVED
  version: "1.0.0"
  title: "IAM, network or key change approved: its digest by a security reviewer, or its run"
spec:
  stage: pre_deploy
  target:
    kind: change
  when:
    exists:
      in: change.resources
      where:
        path: item.type
        in: [aws_iam_policy, aws_iam_role_policy, aws_security_group, aws_security_group_rule, aws_kms_key]
  assert:
    any:
      - exists:
          in: approvals
          where:
            all:
              - path: item.status
                equal: approved
              - path: item.subject.kind
                equal: change
              - path: item.subject.digest
                equal:
                  path: change.digest
              - path: item.roles
                contains: security
              - path: item.independence
                equal: independent
      - exists:
          in: approvals
          where:
            all:
              - path: item.status
                equal: approved
              - path: item.subject.kind
                equal: run
              - path: item.subject.id
                equal:
                  path: run.id
