apiVersion: iltero.io/v1
kind: TechnicalAssertion
metadata:
  id: ILT.CHANGE.SENSITIVE_CHANGE_APPROVED
  version: "1.0.0"
  title: "IAM, network or key change approved: its digest by a security reviewer, or its run"
spec:
  stage: pre_deploy
  target:
    kind: change
    resources:
      - provider: aws
        kinds:
          - iam_access_key
          - iam_group_membership
          - iam_group_policy
          - iam_identity_provider
          - iam_policy
          - iam_policy_attachment
          - iam_role
          - iam_role_policy
          - iam_user_policy
          - kms_grant
          - kms_key
          - kms_key_policy
          - network_acl
          - network_acl_rule
          - security_group
          - security_group_rule
  assert:
    any:
      - exists:
          in: approvals
          where:
            all:
              - path: item.status
                equal: approved
              - path: item.subject.kind
                equal: change
              - path: item.subject.digest
                equal:
                  path: change.digest
              - path: item.roles
                contains: security
              - path: item.independence
                equal: independent
      - exists:
          in: approvals
          where:
            all:
              - path: item.status
                equal: approved
              - path: item.subject.kind
                equal: run
              - path: item.subject.id
                equal:
                  path: run.id
