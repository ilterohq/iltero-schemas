apiVersion: iltero.io/v1
kind: TechnicalAssertion
metadata:
  id: ILT.DEPLOYMENT.IMAGE_BINDING
  version: "1.0.0"
  title: The image the pipeline reports it deployed is the image the deploy checked
  remediation: Deploy the image by the repository and digest the deploy checked, or check the image you deploy.
spec:
  change_type: image_release
  stage: post_deploy
  target:
    kind: deployment
  assert:
    all:
      - path: deployment.repository
        equal:
          path: change.image.repository
      - path: deployment.digest
        equal:
          path: change.image.digest
