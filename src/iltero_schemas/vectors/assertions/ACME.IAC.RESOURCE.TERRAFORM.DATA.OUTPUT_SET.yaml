apiVersion: iltero.com/v1
kind: TechnicalAssertion
metadata:
  id: ACME.IAC.RESOURCE.TERRAFORM.DATA.OUTPUT_SET
  version: "1.0.0"
  title: The configuration's output is v1
spec:
  change_type: iac_change
  stage: plan
  target:
    kind: resource
    resources:
      - tool: terraform
        provider: terraform
        resource_types: [terraform_data]
  when:
    path: resource.name
    equal: config
  assert:
    path: resource.after.output
    equal: v1
