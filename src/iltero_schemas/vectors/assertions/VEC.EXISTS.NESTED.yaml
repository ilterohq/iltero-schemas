apiVersion: iltero.io/v1
kind: TechnicalAssertion
metadata:
  id: VEC.EXISTS.NESTED
  version: "1.0.0"
  title: Nested collection quantifiers
spec:
  stage: plan
  target:
    kind: resource
    provider: vec
    resource_types: [thing]
  assert:
    exists:
      in: resource.related
      where:
        all:
          - path: item.type
            equal: attachment
          - exists:
              in: item.resource.after.rules
              where:
                path: item.port
                equal: 443
