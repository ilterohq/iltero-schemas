apiVersion: iltero.com/v1
kind: TechnicalAssertion
metadata:
  id: VEC.IAC.RESOURCE.VEC.THING.GUARD_UNKNOWN
  version: "1.0.0"
  title: A guard that cannot be resolved
spec:
  change_type: iac_change
  stage: plan
  target:
    kind: resource
    resources:
      - tool: terraform
        provider: vec
        resource_types: [thing]
  when:
    path: organization_scope.environment.name
    equal: production
  assert:
    path: resource.after.a
    equal: true
