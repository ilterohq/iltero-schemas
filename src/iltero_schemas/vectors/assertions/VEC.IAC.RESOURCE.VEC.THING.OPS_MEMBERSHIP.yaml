apiVersion: iltero.com/v1
kind: TechnicalAssertion
metadata:
  id: VEC.IAC.RESOURCE.VEC.THING.OPS_MEMBERSHIP
  version: "1.0.0"
  title: Membership operators
spec:
  change_type: iac_change
  stage: plan
  target:
    kind: resource
    resources:
      - tool: terraform
        provider: vec
        resource_types: [thing]
  assert:
    all:
      - path: resource.after.kind
        in: [a, b, c]
      - path: resource.after.kind
        not_in: [x, y]
      - path: resource.after.tags
        contains: owner
      - path: resource.after.kind
        not_equal: z
      - path: resource.after.kind
        in:
          path: plan.allowed_kinds
