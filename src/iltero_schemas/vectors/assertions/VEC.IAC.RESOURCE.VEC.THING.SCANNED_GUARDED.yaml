apiVersion: iltero.com/v1
kind: TechnicalAssertion
metadata:
  id: VEC.IAC.RESOURCE.VEC.THING.SCANNED_GUARDED
  version: "1.0.0"
  title: A scanner-observed assertion that applies only in production
  description: >-
    A thing in a production environment meets this assertion when the scanner checks its binding names all pass for
    it. The module compiled from it decides only where it applies.
spec:
  change_type: iac_change
  evidence:
    stages: [plan]
  target:
    kind: resource
    resources:
      - tool: terraform
        provider: vec
        resource_types: [thing]
  when:
    path: organization_scope.environment.production
    equal: true
  assert: null
