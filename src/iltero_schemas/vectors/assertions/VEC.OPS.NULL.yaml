apiVersion: iltero.io/v1
kind: TechnicalAssertion
metadata:
  id: VEC.OPS.NULL
  version: "1.0.0"
  title: Comparisons with null
spec:
  change_type: iac_change
  stage: plan
  target:
    kind: resource
    resources:
      - tool: terraform
        provider: vec
        resource_types: [thing]
  assert:
    all:
      - path: resource.after.set
        not_equal: null
      - path: resource.after.cleared
        equal: null
