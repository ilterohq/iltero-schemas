apiVersion: iltero.io/v1
kind: TechnicalAssertion
metadata:
  id: VEC.TRUTH.ANY
  version: "1.0.0"
  title: Truth table of any
spec:
  stage: plan
  target:
    kind: resource
    provider: vec
    resource_types: [thing]
  assert:
    any:
      - path: resource.after.a
        equal: true
      - path: resource.after.b
        equal: true
